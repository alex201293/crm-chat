# =============================================================================
# CRM-Chat Platform - Local Development Environment
# =============================================================================
# Usage:
#   make dev          → Start all services
#   make stop         → Stop all services
#   make logs         → View all logs
#   docker compose up -d postgres redis rabbitmq  → Start only infra
# =============================================================================

services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: crm-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_chat"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  redis:
    image: redis:7-alpine
    container_name: crm-chat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: crm-chat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - crm-network

  # ===========================================================================
  # Application Services
  # ===========================================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: crm-chat-backend
    restart: unless-stopped
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir src
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_SECRET_KEY: "dev-secret-key-at-least-32-characters-long"
      APP_ALLOWED_HOSTS: '["localhost","127.0.0.1","backend"]'
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      BACKEND_WORKERS: "1"
      BACKEND_RELOAD: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: crm_chat
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_ECHO: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      JWT_SECRET_KEY: "dev-jwt-secret-key-change-me"
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      STORAGE_DRIVER: local
      STORAGE_PATH: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/alembic:/app/alembic
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crm-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: crm-chat-celery-worker
    restart: unless-stopped
    command: >
      celery -A src.shared.infrastructure.messaging.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=default,campaigns,ai,notifications
    environment:
      APP_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: crm_chat
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      JWT_SECRET_KEY: "dev-jwt-secret-key-change-me"
      APP_SECRET_KEY: "dev-secret-key-at-least-32-characters-long"
      STORAGE_DRIVER: local
      STORAGE_PATH: /app/storage
    volumes:
      - ./backend/src:/app/src:ro
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - crm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: crm-chat-frontend
    restart: unless-stopped
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      NEXT_PUBLIC_APP_NAME: "CRM Chat"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crm-network

  # ===========================================================================
  # Monitoring (optional, uncomment for observability)
  # ===========================================================================

  # mailhog:
  #   image: mailhog/mailhog
  #   container_name: crm-chat-mailhog
  #   ports:
  #     - "1025:1025"  # SMTP
  #     - "8025:8025"  # Web UI
  #   networks:
  #     - crm-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  backend_storage:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  crm-network:
    driver: bridge
