[project]
name = "crm-chat-backend"
version = "0.1.0"
description = "AI-powered omnichannel CRM & Chat platform - Backend API"
requires-python = ">=3.13,<4.0"
license = { text = "Proprietary" }
authors = [{ name = "CRM Chat Team" }]

dependencies = [
    # Web Framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "pgvector==0.3.6",

    # Cache & Queue
    "redis[hiredis]==5.2.1",
    "celery[redis]==5.4.0",
    "aio-pika==9.5.0",

    # Auth & Security
    "pyjwt[crypto]==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "pyotp==2.9.0",
    "httpx==0.28.1",

    # Validation & Serialization
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",

    # AI Providers
    "openai==1.58.1",
    "anthropic==0.42.0",
    "google-generativeai==0.8.4",
    "mistralai==1.3.1",

    # Document Processing (RAG)
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "beautifulsoup4==4.12.3",
    "tiktoken==0.8.0",

    # WebSocket
    "websockets==14.1",

    # Utilities
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "python-slugify==8.0.4",
    "phonenumbers==8.13.52",
    "Pillow==11.1.0",
    "aiofiles==24.1.0",
    "boto3==1.35.92",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
    "factory-boy==3.3.1",
    "faker==33.1.0",
    "aiosqlite==0.20.0",

    # Linting & Formatting
    "ruff==0.8.6",
    "mypy==1.14.1",

    # Type stubs
    "types-redis==4.6.0.20241004",
    "types-passlib==1.7.7.20240819",
    "sqlalchemy[mypy]==2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ==========================================
# Ruff - Linter & Formatter
# ==========================================
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "ASYNC",# flake8-async
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101",   # assert allowed in tests
    "B008",   # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ==========================================
# Pytest
# ==========================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires DB/Redis)",
    "e2e: End-to-end tests",
]

# ==========================================
# MyPy - Static Type Checking
# ==========================================
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aio_pika.*"
ignore_missing_imports = true
