# =============================================================================
# CRM-Chat Platform - Production Overrides
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Remove init script in production

  redis:
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      # Remove management UI port in production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  backend:
    build:
      target: runtime
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --no-access-log
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_POOL_SIZE: "20"
      DATABASE_MAX_OVERFLOW: "10"
      DATABASE_ECHO: "false"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BACKEND_WORKERS: "4"
      BACKEND_RELOAD: "false"
    volumes: []  # No source mounting in production
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
      replicas: 2

  celery-worker:
    build:
      target: runtime
    command: >
      celery -A src.shared.infrastructure.messaging.celery_app worker
      --loglevel=warning
      --concurrency=4
      --queues=default,campaigns,ai,notifications
    environment:
      APP_ENV: production
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
    volumes: []
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
      replicas: 2

  frontend:
    build:
      target: runner
    command: ["node", "server.js"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    volumes: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
      replicas: 2

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: crm-chat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - crm-network
